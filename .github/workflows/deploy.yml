name: Deploy

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      frontend-tag: ${{ steps.frontend-meta.outputs.tags }}
      backend-tag: ${{ steps.backend-meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata for Frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/justime-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
      
      - name: Extract metadata for Backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/justime-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
      
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./justime_agent
          file: ./deployment/homelab/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./justime_backend
          file: ./deployment/homelab/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: https://staging.justime.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -eu
            cd /opt/justime
            git pull origin main
            JUSTIME_DEPLOY_SHA="$(git rev-parse HEAD)" bash deployment/homelab/scripts/backup-mongodb.sh
            DEPLOY_ATTEMPT_ID="${{ github.run_id }}-${{ github.run_attempt }}-staging"
            DEPLOY_STATE_DIR="deployment/homelab/data/deploy-state/${DEPLOY_ATTEMPT_ID}"
            mkdir -p "${DEPLOY_STATE_DIR}"
            DEPLOY_ATTEMPT_ID="${DEPLOY_ATTEMPT_ID}" bash deployment/homelab/scripts/capture-deploy-state.sh
            docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml build
            CADDY_HTTP_PORT="$(awk -F= '/^CADDY_HTTP_PORT=/{print $2}' deployment/homelab/.env | tail -n1)"
            CADDY_HTTP_PORT="${CADDY_HTTP_PORT:-8088}"
            CANDIDATE_FAILURE_STAGE=""
            if ! docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml up -d --wait --wait-timeout 180; then
              CANDIDATE_FAILURE_STAGE="compose-readiness"
            elif ! BASE_URL="http://127.0.0.1:${CADDY_HTTP_PORT}" bash deployment/homelab/scripts/business-smoke.sh; then
              CANDIDATE_FAILURE_STAGE="business-smoke"
            fi
            if [ -n "${CANDIDATE_FAILURE_STAGE}" ]; then
              {
                echo "candidate_failure_stage=${CANDIDATE_FAILURE_STAGE}"
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml ps || true
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml logs --no-color --tail=200 || true
              } | tee "${DEPLOY_STATE_DIR}/candidate.log"
              ROLLBACK_STATUS="restored"
              ROLLBACK_SMOKE_STATUS="passed"
              if ! bash deployment/homelab/scripts/rollback-images.sh; then
                ROLLBACK_STATUS="failed"
                ROLLBACK_SMOKE_STATUS="not-run"
              elif ! BASE_URL="http://127.0.0.1:${CADDY_HTTP_PORT}" bash deployment/homelab/scripts/business-smoke.sh; then
                ROLLBACK_SMOKE_STATUS="failed"
              fi
              {
                echo "rollback_status=${ROLLBACK_STATUS}"
                echo "rollback_smoke_status=${ROLLBACK_SMOKE_STATUS}"
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml ps || true
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml logs --no-color --tail=200 || true
              } | tee "${DEPLOY_STATE_DIR}/rollback.log"
              echo "[fail] deployment: candidate ${CANDIDATE_FAILURE_STAGE}; rollback=${ROLLBACK_STATUS}; rollback-smoke=${ROLLBACK_SMOKE_STATUS}" >&2
              exit 1
            fi
            docker system prune -f
            bash deployment/homelab/scripts/capture-deploy-state.sh --release

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://justime.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -eu
            cd /opt/justime
            git fetch --tags
            git checkout ${{ github.ref_name }}
            JUSTIME_DEPLOY_SHA="$(git rev-parse HEAD)" bash deployment/homelab/scripts/backup-mongodb.sh
            DEPLOY_ATTEMPT_ID="${{ github.run_id }}-${{ github.run_attempt }}-production"
            DEPLOY_STATE_DIR="deployment/homelab/data/deploy-state/${DEPLOY_ATTEMPT_ID}"
            mkdir -p "${DEPLOY_STATE_DIR}"
            DEPLOY_ATTEMPT_ID="${DEPLOY_ATTEMPT_ID}" bash deployment/homelab/scripts/capture-deploy-state.sh
            docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml build
            CADDY_HTTP_PORT="$(awk -F= '/^CADDY_HTTP_PORT=/{print $2}' deployment/homelab/.env | tail -n1)"
            CADDY_HTTP_PORT="${CADDY_HTTP_PORT:-8088}"
            CANDIDATE_FAILURE_STAGE=""
            if ! docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml up -d --wait --wait-timeout 180; then
              CANDIDATE_FAILURE_STAGE="compose-readiness"
            elif ! BASE_URL="http://127.0.0.1:${CADDY_HTTP_PORT}" bash deployment/homelab/scripts/business-smoke.sh; then
              CANDIDATE_FAILURE_STAGE="business-smoke"
            fi
            if [ -n "${CANDIDATE_FAILURE_STAGE}" ]; then
              {
                echo "candidate_failure_stage=${CANDIDATE_FAILURE_STAGE}"
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml ps || true
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml logs --no-color --tail=200 || true
              } | tee "${DEPLOY_STATE_DIR}/candidate.log"
              ROLLBACK_STATUS="restored"
              ROLLBACK_SMOKE_STATUS="passed"
              if ! bash deployment/homelab/scripts/rollback-images.sh; then
                ROLLBACK_STATUS="failed"
                ROLLBACK_SMOKE_STATUS="not-run"
              elif ! BASE_URL="http://127.0.0.1:${CADDY_HTTP_PORT}" bash deployment/homelab/scripts/business-smoke.sh; then
                ROLLBACK_SMOKE_STATUS="failed"
              fi
              {
                echo "rollback_status=${ROLLBACK_STATUS}"
                echo "rollback_smoke_status=${ROLLBACK_SMOKE_STATUS}"
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml ps || true
                docker compose --env-file deployment/homelab/.env -f deployment/homelab/docker-compose.yml logs --no-color --tail=200 || true
              } | tee "${DEPLOY_STATE_DIR}/rollback.log"
              echo "[fail] deployment: candidate ${CANDIDATE_FAILURE_STAGE}; rollback=${ROLLBACK_STATUS}; rollback-smoke=${ROLLBACK_SMOKE_STATUS}" >&2
              exit 1
            fi
            docker system prune -f
            bash deployment/homelab/scripts/capture-deploy-state.sh --release
            
            # Create release marker
            echo "${{ github.ref_name }}" > /opt/justime/.release
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            DEPLOYMENT.md
            README.md
