name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify lock files are up-to-date with source requirements
  verify-lock-files:
    name: Verify Lock Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-tools
        run: pip install pip-tools==7.5.3

      - name: Verify requirements.lock
        working-directory: justime_backend
        run: |
          pip-compile --no-upgrade --index-url=https://mirrors.aliyun.com/pypi/simple/ --trusted-host=mirrors.aliyun.com --output-file=requirements.lock requirements.in
          if ! git diff --exit-code -- requirements.lock; then
            echo "::error::requirements.lock is out of date. Please run from justime_backend: pip-compile --no-upgrade --index-url=https://mirrors.aliyun.com/pypi/simple/ --trusted-host=mirrors.aliyun.com --output-file=requirements.lock requirements.in"
            exit 1
          fi

      - name: Verify requirements-dev.lock
        working-directory: justime_backend
        run: |
          pip-compile --no-upgrade --index-url=https://mirrors.aliyun.com/pypi/simple/ --trusted-host=mirrors.aliyun.com --output-file=requirements-dev.lock requirements-dev.in
          if ! git diff --exit-code -- requirements-dev.lock; then
            echo "::error::requirements-dev.lock is out of date. Please run from justime_backend: pip-compile --no-upgrade --index-url=https://mirrors.aliyun.com/pypi/simple/ --trusted-host=mirrors.aliyun.com --output-file=requirements-dev.lock requirements-dev.in"
            exit 1
          fi

  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            justime_agent/package-lock.json
      
      - name: Frontend - Install dependencies
        working-directory: justime_agent
        run: npm ci
      
      - name: Frontend - Lint
        working-directory: justime_agent
        run: npm run lint
      
      - name: Frontend - Type Check
        working-directory: justime_agent
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend Tests (justime_agent)
    runs-on: ubuntu-latest
    needs: [code-quality, verify-lock-files]
    
    defaults:
      run:
        working-directory: justime_agent
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: justime_agent/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm test -- --coverage --passWithNoTests
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: justime_agent/coverage/
          retention-days: 7
      
      - name: Build check
        run: npm run build

  backend-tests:
    name: Backend Tests (justime_backend)
    runs-on: ubuntu-latest
    needs: [code-quality, verify-lock-files]
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: justime_backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: justime_backend/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      
      # Required GitHub Secrets for CI tests:
      # - TEST_JWT_SECRET: Test JWT secret key (at least 32 characters)
      # - TEST_JWT_REFRESH_SECRET: Test JWT refresh secret key (at least 32 characters)
      # - TEST_ENCRYPTION_SECRET: Test encryption secret key (at least 32 characters)
      # - TEST_CSRF_SECRET: Test CSRF secret key (at least 32 characters)
      # Configure these in: Settings → Secrets and variables → Actions → New repository secret
      - name: Run tests with coverage
        env:
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH_SECRET }}
          ENCRYPTION_SECRET: ${{ secrets.TEST_ENCRYPTION_SECRET }}
          CSRF_SECRET: ${{ secrets.TEST_CSRF_SECRET }}
          DEBUG: "true"
          MONGODB_URI: mongodb://localhost:27017/justime_test
          MONGODB_DB_NAME: justime_test
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: justime_backend/coverage.xml
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [code-quality, verify-lock-files]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [code-quality, verify-lock-files, frontend-tests, backend-tests, security-scan]
    if: always()
    
    steps:
      - name: Check all jobs passed
        run: |
          echo "=========================================="
          echo "         CI Pipeline Summary"
          echo "=========================================="
          echo ""
          echo "Lock Files:      ${{ needs.verify-lock-files.result }}"
          echo "Code Quality:    ${{ needs.code-quality.result }}"
          echo "Frontend Tests:  ${{ needs.frontend-tests.result }}"
          echo "Backend Tests:   ${{ needs.backend-tests.result }}"
          echo "Security Scan:   ${{ needs.security-scan.result }}"
          echo ""

          if [ "${{ needs.verify-lock-files.result }}" != "success" ]; then
            echo "::error::Lock files verification failed"
            exit 1
          fi

          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "::error::Code quality gate failed"
            exit 1
          fi
          
          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "::error::Frontend tests failed"
            exit 1
          fi

          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "::error::Backend tests failed"
            exit 1
          fi
          
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "::error::Security scan failed — CRITICAL/HIGH vulnerabilities found with no approved exception in .trivyignore"
            exit 1
          fi
          
          echo "=========================================="
          echo "✅ All CI gates passed!"
          echo "=========================================="
