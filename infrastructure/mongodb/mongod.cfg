# MongoDB 配置文件
#
# 使用环境变量配置路径，提高可移植性
# 启动前请设置以下环境变量:
#   - MONGO_DATA_DIR: MongoDB 数据目录 (默认: ./data)
#   - MONGO_LOG_DIR: MongoDB 日志目录 (默认: ./data/log)
#
# 示例:
#   export MONGO_DATA_DIR=/var/lib/mongodb
#   export MONGO_LOG_DIR=/var/log/mongodb
#   mongod --config mongod.cfg

systemLog:
    destination: file
    path: ${MONGO_LOG_DIR:-./data/log}/mongod.log
storage:
    dbPath: ${MONGO_DATA_DIR:-./data/db}
