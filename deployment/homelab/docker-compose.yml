x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 30s

services:
  gateway:
    image: caddy:2
    container_name: justime-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      openclaw:
        condition: service_started
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-8088}:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/logs/caddy:/var/log/caddy
    tmpfs:
      - /tmp:rw,size=64m
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      <<: *healthcheck-defaults
      start_period: 10s
    init: true
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *logging

  frontend:
    build:
      context: ${JUSTIME_REPO_ROOT}/justime_agent
      dockerfile: ../deployment/homelab/frontend/Dockerfile
    container_name: justime-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-/backend}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
      start_period: 40s
    init: true
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,size=128m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *logging

  backend:
    build:
      context: ${JUSTIME_REPO_ROOT}/justime_backend
      dockerfile: ../deployment/homelab/backend/Dockerfile
    container_name: justime-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      DEBUG: ${DEBUG:-false}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ROUTER_ENABLED: ${ROUTER_ENABLED:-true}
      ENABLE_ROUTING_META: ${ENABLE_ROUTING_META:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      FEISHU_CLIENT_ID: ${FEISHU_CLIENT_ID}
      FEISHU_CLIENT_SECRET: ${FEISHU_CLIENT_SECRET}
      NOTEBOOKLM_CLI_PATH: ${NOTEBOOKLM_CLI_PATH}
      OPENCLAW_ENABLED: ${OPENCLAW_ENABLED:-true}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS:-180}
      OPENCLAW_SESSION_PREFIX: ${OPENCLAW_SESSION_PREFIX:-justime}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/logs/backend:/app/logs
      - ./data/backend/output:/app/output
    tmpfs:
      - /tmp:rw,size=128m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/').status == 200 else 1)",
        ]
      <<: *healthcheck-defaults
    init: true
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *logging

  mongodb:
    image: mongo:7
    container_name: justime-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    command: ["mongod", "--bind_ip", "0.0.0.0", "--auth"]
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-justime-agent}
    shm_size: 256m
    volumes:
      - ./data/mongodb:/data/db
      - ./scripts/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    tmpfs:
      - /tmp:rw,size=128m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      <<: *healthcheck-defaults
      start_period: 20s
    init: true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: justime-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    tmpfs:
      - /tmp:rw,size=32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *logging

  openclaw:
    image: node:24-bookworm-slim
    container_name: justime-openclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_STATE_DIR: ${OPENCLAW_STATE_DIR:-/var/lib/openclaw}
      OPENCLAW_CONFIG_PATH: ${OPENCLAW_CONFIG_PATH:-/var/lib/openclaw/openclaw.json}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
    volumes:
      - ./data/openclaw:/var/lib/openclaw
      - ./data/logs/openclaw:/var/log/openclaw
    tmpfs:
      - /tmp:rw,size=128m
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        apt-get update
        apt-get install -y --no-install-recommends git
        rm -rf /var/lib/apt/lists/*
        npm install -g openclaw@2026.3.11
        mkdir -p "${OPENCLAW_STATE_DIR}" "${OPENCLAW_STATE_DIR}/workspace" /var/log/openclaw
        if [ -n "${MINIMAX_API_KEY:-}" ]; then
          openclaw onboard \
            --non-interactive \
            --accept-risk \
            --mode local \
            --auth-choice minimax-api-key-cn \
            --minimax-api-key "${MINIMAX_API_KEY}" \
            --gateway-auth token \
            --gateway-token-ref-env OPENCLAW_GATEWAY_TOKEN \
            --gateway-bind lan \
            --gateway-port 18789 \
            --workspace "${OPENCLAW_STATE_DIR}/workspace" \
            --skip-daemon \
            --skip-ui \
            --skip-health \
            --skip-search \
            --skip-skills \
            --skip-channels
        fi
        exec openclaw gateway run --allow-unconfigured --bind lan --auth token --port 18789 --token "${OPENCLAW_GATEWAY_TOKEN}" --ws-log compact
    healthcheck:
      test: ["CMD-SHELL", "openclaw gateway call health --url ws://127.0.0.1:18789 --token \"$OPENCLAW_GATEWAY_TOKEN\" --timeout 5000 >/dev/null 2>&1"]
      <<: *healthcheck-defaults
      start_period: 45s
    init: true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *logging
